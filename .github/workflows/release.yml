# The CLI release: build the `unharnessed` archives for Linux, macOS and
# Windows, install each one with the real install scripts on its own system
# and run it, then (on a version tag only) publish a GitHub release with the
# archives, their SHA-256 files and the install scripts.
#
#   Pull requests that touch the CLI: build + install tests, nothing published.
#   A tag vX.Y.Z (the workspace version in Cargo.toml): the same, then the release.
#
# The release job is the only one with write access (contents: write).
name: release

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "unharnessed-runtime/**"
      - "skills/**"
      - "scripts/install.sh"
      - "scripts/install.ps1"
      - "scripts/package-cli.py"
      - "scripts/unharnessed-cli-e2e.py"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  build:
    name: build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: linux-x64, os: ubuntu-24.04, target: x86_64-unknown-linux-musl }
          - { platform: linux-arm64, os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl }
          # Both macOS builds on the Intel pool: Apple's toolchain builds
          # arm64 from there too, and the arm64 pool is often saturated.
          - { platform: darwin-arm64, os: macos-15-intel, target: aarch64-apple-darwin }
          - { platform: darwin-x64, os: macos-15-intel, target: x86_64-apple-darwin }
          - { platform: windows-x64, os: windows-latest, target: x86_64-pc-windows-msvc }
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@ce678459e9fc7500d337468f904b95f1b5c10b5e # 1.98.1 action pin; toolchain pinned below
        with:
          toolchain: "1.98.1"
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: ${{ matrix.target }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Static Linux binaries (musl): they run on any distribution. ring's C
      # code builds with musl-gcc.
      - name: Install musl tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
          triple='${{ matrix.target }}'
          echo "CC_${triple//-/_}=musl-gcc" >> "$GITHUB_ENV"
      - name: Build
        shell: bash
        run: cargo build --release --locked -p uh-cli --bin unharnessed --target ${{ matrix.target }}
      - name: Version on a tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: echo "PACKAGE_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - name: Package
        shell: bash
        run: |
          exe=unharnessed
          if [ "${{ runner.os }}" = Windows ]; then exe=unharnessed.exe; fi
          python scripts/package-cli.py ${{ matrix.platform }} "target/${{ matrix.target }}/release/$exe" dist \
            ${PACKAGE_VERSION:+--version "$PACKAGE_VERSION"}
      - uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error

  # Install each archive with the real install script on its own system,
  # from a local web server, then run it against the faux provider (no
  # network model, no credentials): the binary starts, the kernel builds,
  # a cell runs.
  install-unix:
    name: install ${{ matrix.platform }}
    needs: build
    # Each platform tests its own archive, even when another build failed;
    # the release still needs every job to pass.
    if: ${{ !cancelled() }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: linux-x64, os: ubuntu-24.04 }
          - { platform: linux-arm64, os: ubuntu-24.04-arm }
          - { platform: darwin-arm64, os: macos-15 }
          - { platform: darwin-x64, os: macos-15-intel }
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: cli-${{ matrix.platform }}
          path: dist
      - name: Serve the archive
        run: |
          python3 -m http.server 8765 --directory dist > /dev/null 2>&1 &
          sleep 2
      - name: Install (piped into sh, the documented way)
        env:
          UNHARNESSED_DOWNLOAD_URL: http://127.0.0.1:8765
        run: cat scripts/install.sh | sh
      - name: Install again (an update over the first install)
        env:
          UNHARNESSED_DOWNLOAD_URL: http://127.0.0.1:8765
        run: sh scripts/install.sh
      - name: The command runs
        run: |
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/unharnessed" --version
          "$HOME/.local/bin/unharnessed" --help | grep -q 'login'
          test -f "$HOME/.unharnessed/app/unharnessed-runtime/pyproject.toml"
      - name: A turn runs a cell in the kernel
        run: |
          mkdir -p "$RUNNER_TEMP/smoke" && cd "$RUNNER_TEMP/smoke"
          export UNHARNESSED_FAUX_SCRIPT='{"responses":[{"content":[{"type":"toolCall","name":"ipython","arguments":{"code":"open(\"kernel-ran.txt\",\"w\").write(str(6*7))"}}]},"smoke ok"]}'
          output="$(unharnessed -p --no-session "go")"
          echo "$output"
          echo "$output" | grep -q 'smoke ok'
          test "$(cat kernel-ran.txt)" = 42
      - name: The terminal chat, end to end
        run: |
          UNHARNESSED_BIN="$HOME/.unharnessed/app/unharnessed" \
            python3 scripts/unharnessed-cli-e2e.py "$RUNNER_TEMP/cli-e2e"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cli-e2e-${{ matrix.platform }}
          path: ${{ runner.temp }}/cli-e2e/*.out
          if-no-files-found: ignore

  install-windows:
    name: install windows-x64
    needs: build
    if: ${{ !cancelled() }}
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: cli-windows-x64
          path: dist
      - name: Serve the archive
        shell: pwsh
        run: |
          Start-Process python -ArgumentList '-m','http.server','8765','--directory','dist' -WindowStyle Hidden
          Start-Sleep -Seconds 3
      - name: Install with Windows PowerShell 5.1 (irm | iex, the documented way)
        shell: powershell
        env:
          UNHARNESSED_DOWNLOAD_URL: http://127.0.0.1:8765
        run: |
          Get-Content -Raw scripts/install.ps1 | Invoke-Expression
          if (-not (Test-Path "$env:USERPROFILE\.unharnessed\app\unharnessed.exe")) { throw 'not installed' }
          # The binary puts its kernel under HOME when it is set, else USERPROFILE.
          $homeDir = if ($env:HOME) { $env:HOME } else { $env:USERPROFILE }
          if (-not (Test-Path "$homeDir\.unharnessed\kernel-venv\Scripts\python.exe")) { throw 'the kernel venv was not built' }
      - name: Install again with PowerShell 7 (an update over the first install)
        shell: pwsh
        env:
          UNHARNESSED_DOWNLOAD_URL: http://127.0.0.1:8765
        run: |
          pwsh -NoProfile -File scripts/install.ps1
          if ($LASTEXITCODE -ne 0) { throw "install.ps1 exited $LASTEXITCODE" }
      - name: The command runs, and the user PATH has it
        shell: pwsh
        run: |
          $app = "$env:USERPROFILE\.unharnessed\app"
          $userPath = [Environment]::GetEnvironmentVariable('Path', 'User')
          if (-not (($userPath -split ';') -contains $app)) { throw "user PATH lacks $app : $userPath" }
          & "$app\unharnessed.exe" --version
          if ($LASTEXITCODE -ne 0) { throw 'unharnessed --version failed' }
          $help = & "$app\unharnessed.exe" --help | Out-String
          if ($help -notmatch 'login') { throw 'login is not in --help' }
          Add-Content $env:GITHUB_PATH $app
          Add-Content $env:GITHUB_PATH "$env:USERPROFILE\.local\bin"
      - name: A turn runs a cell in the kernel
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'smoke'
          New-Item -ItemType Directory -Force $dir | Out-Null
          Set-Location $dir
          $env:UNHARNESSED_FAUX_SCRIPT = '{"responses":[{"content":[{"type":"toolCall","name":"ipython","arguments":{"code":"open(\"kernel-ran.txt\",\"w\").write(str(6*7))"}}]},"smoke ok"]}'
          $output = unharnessed -p --no-session "go" | Out-String
          Write-Host $output
          if ($output -notmatch 'smoke ok') { throw 'no answer' }
          if ((Get-Content kernel-ran.txt) -ne '42') { throw 'the cell did not run' }

  release:
    name: publish the release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, install-unix, install-windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: The tag matches the workspace version
        run: |
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml","rb"))["workspace"]["package"]["version"])')"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match the workspace version $version" >&2
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          pattern: cli-*
          path: dist
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -f dist/*.out
          cp scripts/install.sh scripts/install.ps1 dist/
          ls -l dist
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Unharnessed $GITHUB_REF_NAME" \
            --notes "Install the CLI:

          - Linux and macOS: \`curl -fsSL https://github.com/$GITHUB_REPOSITORY/releases/latest/download/install.sh | sh\`
          - Windows (PowerShell): \`irm https://github.com/$GITHUB_REPOSITORY/releases/latest/download/install.ps1 | iex\`

          Then run \`unharnessed\` in a project folder."
